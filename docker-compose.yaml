services:
  coolify-deploy-gateway:
    build: .
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      LISTEN_ADDR: ":8080"
      COOLIFY_BASE_URL: ${COOLIFY_BASE_URL:?COOLIFY_BASE_URL is required}
      COOLIFY_ALLOW_INSECURE_HTTP: ${COOLIFY_ALLOW_INSECURE_HTTP:-false}
      COOLIFY_API_TOKEN: ${COOLIFY_API_TOKEN:?COOLIFY_API_TOKEN is required}
      DEPLOY_TARGETS_JSON: ${DEPLOY_TARGETS_JSON:?DEPLOY_TARGETS_JSON is required}
    expose:
      - "8080"
    networks:
      coolify:
        aliases:
          - coolify-deploy-gateway
    healthcheck:
      test: ["CMD", "/coolify-deploy-gateway", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  coolify:
    external: true
    name: coolify
